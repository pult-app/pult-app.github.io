openapi: 3.1.0
info:
  title: Пульт Германа, ingest API
  version: 1.0.0
  summary: API, через который ИИ-агенты записывают данные в пульт.
  description: |
    Клиенты API: задачи по расписанию в Claude Code (funnel-sync, internship-scan).
    PWA этим API не пользуется: она работает через Supabase Data API (PostgREST) под RLS.

    Правила:
    - Авторизация: `Authorization: Bearer <токен агента>`. В базе хранится только SHA-256 токена.
    - Права (scopes) выдаются токену. Нужное право указано у операции в `x-required-scopes`.
    - Идемпотентность: записи с естественным ключом создаются и обновляются через `PUT`.
      Для `POST /flashcards` обязателен заголовок `Idempotency-Key`.
    - Оптимистичная блокировка: `PATCH /vacancies/{ref}` требует `If-Match` с ETag из `GET`.
      Нет заголовка: 428. Версия устарела (Герман правил запись): 412.
    - Ошибки в формате `application/problem+json` (RFC 9457).
    - Лимит: 60 запросов в минуту на токен, дальше 429 с заголовком `Retry-After`.
    - Даты `YYYY-MM-DD`, время `date-time` с зоной. Бизнес-время Europe/Moscow.
  contact:
    name: Герман Полькин
servers:
  - url: https://{project}.supabase.co/functions/v1/ingest/v1
    variables:
      project:
        default: pult
        description: Идентификатор проекта Supabase
security:
  - agentToken: []
tags:
  - name: Запуски
  - name: Вакансии
  - name: Письма
  - name: Учёба
  - name: Дела
  - name: Тренажёр
  - name: Расписание

paths:
  /sync-runs:
    post:
      tags: [Запуски]
      operationId: startSyncRun
      summary: Открыть запуск агента
      x-required-scopes: [runs:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRunStart' }
            example: { job: funnel-sync }
      responses:
        '201':
          description: Запуск открыт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /sync-runs/{runId}:
    parameters:
      - name: runId
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Запуски]
      operationId: finishSyncRun
      summary: Закрыть запуск с итогом
      x-required-scopes: [runs:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SyncRunFinish' }
            example:
              status: success
              stats: { messagesCreated: 2, vacanciesUpdated: 1 }
      responses:
        '200':
          description: Запуск закрыт
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncRun' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Запуск уже закрыт
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /vacancies:
    get:
      tags: [Вакансии]
      operationId: listVacancies
      summary: Список вакансий для сопоставления писем
      x-required-scopes: [vacancies:read]
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/VacancyStatus' }
        - name: updatedSince
          in: query
          description: Только изменённые после момента
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница вакансий
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Vacancy' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /vacancies/{ref}:
    parameters:
      - $ref: '#/components/parameters/VacancyRef'
    get:
      tags: [Вакансии]
      operationId: getVacancy
      summary: Вакансия по внешнему ключу
      x-required-scopes: [vacancies:read]
      responses:
        '200':
          description: Вакансия
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Вакансии]
      operationId: upsertVacancy
      summary: Создать вакансию или заменить поля, которые ведёт агент
      description: |
        Идемпотентно. Компания создаётся по имени, если её ещё нет.
        Поля `nextStep`, `prep`, `notes`, изменённые Германом, агент через PUT не перезаписывает:
        для правки существующей вакансии используется PATCH с If-Match.
      x-required-scopes: [vacancies:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VacancyInput' }
            example:
              company: Компания N
              title: Стажёр системный аналитик
              status: applied
              appliedOn: '2026-09-23'
              workFormat: удалённо
              channel: hh.ru
              url: https://hh.ru/vacancy/0000000
      responses:
        '200':
          description: Вакансия уже была, данные совпали или обновлены
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '201':
          description: Вакансия создана
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }
    patch:
      tags: [Вакансии]
      operationId: patchVacancy
      summary: Изменить вакансию с проверкой версии
      description: |
        Правило статусов: агент не возвращает вакансию на более ранний этап
        (found, applied, test, interview, offer). Отказ и резерв ставятся с любого этапа.
        Нарушение правила даёт 422 с кодом `status-downgrade`.
      x-required-scopes: [vacancies:write]
      parameters:
        - name: If-Match
          in: header
          required: true
          description: ETag из последнего GET
          schema: { type: string, example: '"7"' }
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: { $ref: '#/components/schemas/VacancyPatch' }
            example: { status: interview, nextStep: Техсобес 30.09 в 15:00 }
      responses:
        '200':
          description: Изменено
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vacancy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412':
          description: Версия устарела, запись изменили после чтения. Нужно перечитать и повторить.
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Unprocessable' }
        '428':
          description: Нет заголовка If-Match
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /messages:
    get:
      tags: [Письма]
      operationId: listMessages
      summary: Письма после момента (для проверки дублей и отчёта)
      x-required-scopes: [messages:read]
      parameters:
        - name: since
          in: query
          required: true
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Страница писем
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Message' }
                  nextCursor: { type: [string, 'null'] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /messages/{source}/{externalId}:
    parameters:
      - name: source
        in: path
        required: true
        schema: { $ref: '#/components/schemas/MessageSource' }
      - name: externalId
        in: path
        required: true
        description: id письма в Gmail или сообщения в чате hh.ru
        schema: { type: string, maxLength: 200 }
    put:
      tags: [Письма]
      operationId: upsertMessage
      summary: Записать письмо компании
      description: |
        Идемпотентно по паре source и externalId. Для типов invite, test, offer и question
        сервер ставит Web Push в очередь. Поле `isDone` через этот метод не меняется:
        его ведёт Герман.
      x-required-scopes: [messages:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageInput' }
            example:
              kind: invite
              receivedAt: '2026-09-25T10:04:00+03:00'
              company: Компания N
              vacancyRef: n-sa-intern
              sender: HR Компании N
              subject: Приглашение на техническое интервью
              summary: Зовут на техсобес, нужно выбрать слот
              action: Выбрать слот в календаре до 27.09
              deadline: '2026-09-27'
      responses:
        '200':
          description: Письмо уже было записано, данные обновлены
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '201':
          description: Письмо записано
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Message' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /study-works/{code}:
    parameters:
      - name: code
        in: path
        required: true
        schema: { type: string, pattern: '^[a-z0-9-]{2,60}$', example: ib-lr2 }
    put:
      tags: [Учёба]
      operationId: upsertStudyWork
      summary: Создать или обновить учебную работу
      description: Статус, который поставил Герман, агент через PUT не откатывает.
      x-required-scopes: [study:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudyWorkInput' }
            example:
              discipline: Информационная безопасность
              teacher: Петрова А. А.
              title: ЛР2
              status: todo
              deadline: '2026-10-08'
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyWork' }
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudyWork' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /tasks/{externalId}:
    parameters:
      - name: externalId
        in: path
        required: true
        schema: { type: string, maxLength: 120, example: 2026-10-26-icloud }
    put:
      tags: [Дела]
      operationId: upsertTask
      summary: Создать или обновить дело со сроком
      x-required-scopes: [tasks:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskInput' }
            example:
              title: Продление iCloud+ 200 ГБ
              dueDate: '2026-10-26'
              kind: money
      responses:
        '200':
          description: Обновлено
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '201':
          description: Создано
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /flashcards:
    post:
      tags: [Тренажёр]
      operationId: createFlashcard
      summary: Добавить карточку после собеседования
      description: |
        У карточки нет естественного ключа, поэтому повтор защищён заголовком Idempotency-Key.
        Повтор с тем же ключом и тем же телом в течение 24 часов возвращает сохранённый ответ.
        Тот же ключ с другим телом даёт 422 с кодом `idempotency-key-reused`.
      x-required-scopes: [cards:write]
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 100 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlashcardInput' }
            example:
              topic: HTTP
              question: Чем 412 отличается от 409?
              answer: 412 значит, что не выполнилось условие запроса, например If-Match. 409 это конфликт с состоянием ресурса.
              source: Подготовка к Компании N, разбор техсобеса
      responses:
        '201':
          description: Карточка создана
          headers:
            Location: { $ref: '#/components/headers/Location' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Flashcard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /schedules/{groupCode}:
    parameters:
      - name: groupCode
        in: path
        required: true
        schema: { type: string, maxLength: 40, example: ПИ-124 }
    put:
      tags: [Расписание]
      operationId: putSchedule
      summary: Загрузить снимок расписания группы
      description: |
        Если хэш совпадает с текущим снимком, ничего не меняется и возвращается 200 с `changed: false`.
        Новый хэш создаёт снимок и делает его текущим.
      x-required-scopes: [schedule:write]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleInput' }
      responses:
        '200':
          description: Расписание не изменилось
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleResult' }
        '201':
          description: Сохранён новый снимок
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/Unprocessable' }

components:
  securitySchemes:
    agentToken:
      type: http
      scheme: bearer
      description: |
        Токен агента, 32 случайных байта в base64url. Срок жизни 180 дней.
        Права: runs:write, vacancies:read, vacancies:write, messages:read, messages:write,
        study:write, tasks:write, cards:write, schedule:write.

  parameters:
    VacancyRef:
      name: ref
      in: path
      required: true
      description: Внешний ключ вакансии латиницей, например hh-100000001 или n-sa-intern
      schema: { type: string, pattern: '^[a-z0-9-]{2,80}$' }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }

  headers:
    ETag:
      description: Версия записи (row_version)
      schema: { type: string, example: '"8"' }
    Location:
      description: Адрес созданного ресурса
      schema: { type: string }

  responses:
    Unauthorized:
      description: Нет токена, токен неверный, отозван или истёк
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: У токена нет нужного права
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Ресурс не найден
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unprocessable:
      description: Тело не прошло проверку схемы или бизнес-правил
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://pult.germanpolkin.ru/problems/validation
            title: Ошибка валидации
            status: 422
            errors:
              - field: summary
                message: не длиннее 500 символов
    TooManyRequests:
      description: Превышен лимит запросов
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    VacancyStatus:
      type: string
      enum: [found, applied, test, interview, offer, reserve, reject, skip]
    MessageKind:
      type: string
      enum: [invite, test, offer, reject, question, ack, info]
    MessageSource:
      type: string
      enum: [gmail, hh_chat, telegram, manual]
    WorkStatus:
      type: string
      enum: [todo, doing, ready, submitted]
    TaskKind:
      type: string
      enum: [study, career, money, life]
    Actor:
      type: string
      enum: [owner, agent, system]

    Problem:
      type: object
      description: RFC 9457
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Машинный код, например status-downgrade или idempotency-key-reused
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }

    SyncRunStart:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job: { type: string, maxLength: 60, example: funnel-sync }
    SyncRunFinish:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status: { type: string, enum: [success, partial, failed] }
        stats:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
        error: { type: string, maxLength: 2000 }
    SyncRun:
      type: object
      required: [id, job, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        job: { type: string }
        status: { type: string, enum: [running, success, partial, failed] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        stats: { type: object, additionalProperties: { type: integer } }
        error: { type: [string, 'null'] }

    VacancyInput:
      type: object
      additionalProperties: false
      required: [company, title, status]
      properties:
        company: { type: string, minLength: 1, maxLength: 120 }
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: '#/components/schemas/VacancyStatus' }
        appliedOn:
          type: [string, 'null']
          format: date
          description: Обязательно для всех статусов, кроме found и skip
        deadline: { type: [string, 'null'], format: date }
        workFormat: { type: [string, 'null'], maxLength: 120 }
        channel: { type: [string, 'null'], maxLength: 80 }
        url: { type: [string, 'null'], format: uri }
        nextStep: { type: [string, 'null'], maxLength: 500 }
        prep: { type: [string, 'null'], maxLength: 2000 }
    VacancyPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: { $ref: '#/components/schemas/VacancyStatus' }
        appliedOn: { type: [string, 'null'], format: date }
        deadline: { type: [string, 'null'], format: date }
        nextStep: { type: [string, 'null'], maxLength: 500 }
        prep: { type: [string, 'null'], maxLength: 2000 }
        notes: { type: [string, 'null'], maxLength: 4000 }
    Vacancy:
      allOf:
        - $ref: '#/components/schemas/VacancyInput'
        - type: object
          required: [ref, version, updatedAt, updatedBy]
          properties:
            ref: { type: string }
            notes: { type: [string, 'null'] }
            followedUpOn: { type: [string, 'null'], format: date }
            version: { type: integer, minimum: 1 }
            updatedBy: { $ref: '#/components/schemas/Actor' }
            updatedAt: { type: string, format: date-time }

    MessageInput:
      type: object
      additionalProperties: false
      required: [kind, receivedAt, summary]
      properties:
        kind: { $ref: '#/components/schemas/MessageKind' }
        receivedAt: { type: string, format: date-time }
        company: { type: [string, 'null'], maxLength: 120 }
        vacancyRef: { type: [string, 'null'], pattern: '^[a-z0-9-]{2,80}$' }
        sender: { type: [string, 'null'], maxLength: 200 }
        subject: { type: [string, 'null'], maxLength: 300 }
        summary: { type: string, minLength: 1, maxLength: 500 }
        action: { type: [string, 'null'], maxLength: 200 }
        deadline: { type: [string, 'null'], format: date }
    Message:
      allOf:
        - $ref: '#/components/schemas/MessageInput'
        - type: object
          required: [id, source, externalId, isDone, createdAt]
          properties:
            id: { type: string, format: uuid }
            source: { $ref: '#/components/schemas/MessageSource' }
            externalId: { type: string }
            isDone: { type: boolean }
            createdAt: { type: string, format: date-time }

    StudyWorkInput:
      type: object
      additionalProperties: false
      required: [discipline, title, status]
      properties:
        discipline: { type: string, minLength: 1, maxLength: 200 }
        teacher: { type: [string, 'null'], maxLength: 200 }
        title: { type: string, minLength: 1, maxLength: 300 }
        status: { $ref: '#/components/schemas/WorkStatus' }
        deadline: { type: [string, 'null'], format: date }
        notes: { type: [string, 'null'], maxLength: 2000 }
        localPath: { type: [string, 'null'], maxLength: 300 }
    StudyWork:
      allOf:
        - $ref: '#/components/schemas/StudyWorkInput'
        - type: object
          required: [code, version, updatedBy]
          properties:
            code: { type: string }
            version: { type: integer }
            updatedBy: { $ref: '#/components/schemas/Actor' }

    TaskInput:
      type: object
      additionalProperties: false
      required: [title, dueDate, kind]
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        dueDate: { type: string, format: date }
        dueTime: { type: [string, 'null'], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        kind: { $ref: '#/components/schemas/TaskKind' }
        notes: { type: [string, 'null'], maxLength: 1000 }
    Task:
      allOf:
        - $ref: '#/components/schemas/TaskInput'
        - type: object
          required: [externalId, isDone]
          properties:
            externalId: { type: string }
            isDone: { type: boolean }

    FlashcardInput:
      type: object
      additionalProperties: false
      required: [topic, question, answer]
      properties:
        topic: { type: string, maxLength: 60 }
        question: { type: string, minLength: 1, maxLength: 500 }
        answer: { type: string, minLength: 1, maxLength: 2000 }
        source: { type: [string, 'null'], maxLength: 200 }
    Flashcard:
      allOf:
        - $ref: '#/components/schemas/FlashcardInput'
        - type: object
          required: [id, box, dueOn]
          properties:
            id: { type: string, format: uuid }
            box: { type: integer, minimum: 0, maximum: 4 }
            dueOn: { type: string, format: date }

    ScheduleInput:
      type: object
      additionalProperties: false
      required: [sourceHash, capturedAt, times, days]
      properties:
        sourceHash: { type: string, minLength: 8, maxLength: 128 }
        capturedAt: { type: string, format: date-time }
        times:
          type: array
          minItems: 7
          maxItems: 7
          items:
            type: array
            minItems: 2
            maxItems: 2
            items: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' }
        days:
          type: array
          maxItems: 7
          items:
            type: object
            additionalProperties: false
            required: [name, n, z]
            properties:
              name: { type: string, example: Понедельник }
              n:
                type: array
                description: Пары числителя, 7 слотов, пустая строка если пары нет
                minItems: 7
                maxItems: 7
                items: { type: string, maxLength: 500 }
              z:
                type: array
                description: Пары знаменателя
                minItems: 7
                maxItems: 7
                items: { type: string, maxLength: 500 }
    ScheduleResult:
      type: object
      required: [groupCode, sourceHash, changed]
      properties:
        groupCode: { type: string }
        sourceHash: { type: string }
        changed: { type: boolean }
